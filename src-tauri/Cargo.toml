[package]
name = "weekly-flow"
version = "3.0.0"
description = "Weekly Flow - gestor semanal de proyectos y pomodoro"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "weekly-flow"
path = "src/main.rs"
